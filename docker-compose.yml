name: sql-trainer
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./src:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ./src:/app
      # Het SQL-bestand van de oefen-database, nodig voor de knop "Database resetten"
      - ./docker/mysql:/database:ro
    environment:
      DB_HOST: mysql
      DB_NAME: oefen-database
      DB_USER: sql-trainer
      DB_PASSWORD: sql-trainer
      DB_SEED_FILE: /database/example-database.sql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oefen-database
      MYSQL_USER: sql-trainer
      MYSQL_PASSWORD: sql-trainer
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql

volumes:
  app:
  mysql-data: